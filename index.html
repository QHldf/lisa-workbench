// ========== 初始化 ==========
document.addEventListener('DOMContentLoaded', function() {
  renderStats();
  renderTab('today');
  document.querySelector('.tabs').addEventListener('click', function(e) {
    if (e.target.classList.contains('tab')) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      e.target.classList.add('active');
      renderTab(e.target.dataset.tab);
    }
  });
});

function renderStats() {
  const el = document.getElementById('statsBar');
  const urgent = DATA.active.filter(c => c.status === '紧急').length;
  el.innerHTML = `
    <div class="stat"><div class="num">${DATA.clients.length}</div><div class="label">总客户</div></div>
    <div class="stat"><div class="num">${DATA.active.length}</div><div class="label">在做客户</div></div>
    <div class="stat"><div class="num">${DATA.banks.length}</div><div class="label">银行机构</div></div>
    <div class="stat"><div class="num" style="color:#c62828">${urgent}</div><div class="label">紧急</div></div>
  `;
}

function renderTab(tab) {
  const el = document.getElementById('mainContent');
  switch(tab) {
    case 'today': renderToday(el); break;
    case 'clients': renderClients(el); break;
    case 'banks': renderBanks(el); break;
    case 'match': renderMatch(el); break;
  }
}

// ========== 今日作战 ==========
function renderToday(el) {
  if (!DATA.active.length) { el.innerHTML = '<div class="empty">暂无在做客户</div>'; return; }
  let html = '';
  const groups = {'紧急':[], '推进中':[], '待反馈':[], '暂停':[]};
  DATA.active.forEach(c => {
    const g = groups[c.status] ? c.status : '推进中';
    groups[g].push(c);
  });
  for (const [status, list] of Object.entries(groups)) {
    if (!list.length) continue;
    const cls = status==='紧急'?'badge-urgent':status==='推进中'?'badge-active':status==='待反馈'?'badge-wait':'badge-pause';
    html += `<div style="margin:8px 0 4px"><span class="badge ${cls}">${status} (${list.length})</span></div>`;
    list.forEach(c => {
      html += `<div class="card" onclick="showDetail('${c.name}')">
        <div class="name">${c.name}</div>
        <div class="meta">💰 开票${c.income || 0}万 | ${c.tag || '无标签'}</div>
      </div>`;
    });
  }
  el.innerHTML = html;
}

// ========== 客户档案 ==========
let clientFilter = { search: '', tag: '', active: false };

function renderClients(el) {
  let html = `<input class="search" placeholder="🔍 搜索客户名称..." oninput="clientFilter.search=this.value;filterClients()">
  <div class="filter-row" id="tagFilters"></div>
  <div id="clientList"></div>`;
  el.innerHTML = html;
  // 标签筛选
  const tags = DATA.tags.slice(0, 10);
  const tf = document.getElementById('tagFilters');
  let tfHtml = `<button class="filter-btn ${!clientFilter.tag?'active':''}" onclick="clientFilter.tag='';filterClients()">全部</button>`;
  tags.forEach(t => {
    tfHtml += `<button class="filter-btn ${clientFilter.tag===t?'active':''}" onclick="clientFilter.tag='${t}';filterClients()">${t}</button>`;
  });
  tfHtml += `<button class="filter-btn ${clientFilter.active?'active':''}" onclick="clientFilter.active=!clientFilter.active;filterClients()">在做</button>`;
  tf.innerHTML = tfHtml;
  filterClients();
}

function filterClients() {
  const el = document.getElementById('clientList');
  let list = DATA.clients;
  if (clientFilter.search) {
    const s = clientFilter.search.toLowerCase();
    list = list.filter(c => c.name.toLowerCase().includes(s));
  }
  if (clientFilter.tag) {
    list = list.filter(c => c.tags && c.tags.includes(clientFilter.tag));
  }
  if (clientFilter.active) {
    list = list.filter(c => c.status);
  }
  if (!list.length) { el.innerHTML = '<div class="empty">没有匹配的客户</div>'; return; }
  let html = `<div style="font-size:12px;color:#999;margin-bottom:6px">共 ${list.length} 家</div>`;
  list.forEach(c => {
    const tagCls = c.has_tech ? 'tag-tech' : 'tag-none';
    const statusBadge = c.status ? `<span class="badge ${c.status==='紧急'?'badge-urgent':c.status==='推进中'?'badge-active':'badge-wait'}">${c.status}</span>` : '';
    html += `<div class="card" onclick="showDetail('${c.name}')">
      <div class="name">${c.name} ${statusBadge}</div>
      <div class="meta">
        💰 ${c.income || 0}万 | 负债${c.debt_total || 0}万 | ${c.legal_age || '?'}岁
        ${c.tax_grade ? ' | 纳税' + c.tax_grade + '级' : ''}
      </div>
      <div>${c.tags ? c.tags.map(t => `<span class="tag ${tagCls}">${t}</span>`).join('') : '<span class="tag tag-none">无标签</span>'}</div>
    </div>`;
  });
  el.innerHTML = html;
}

// ========== 银行地图 ==========
let bankFilter = '';

function renderBanks(el) {
  let html = `<input class="search" placeholder="🔍 搜索银行..." oninput="bankFilter=this.value;filterBanks()">
  <div class="filter-row">
    <button class="filter-btn active" onclick="bankTierFilter='';filterBanks()">全部</button>
    <button class="filter-btn" onclick="bankTierFilter='T1';filterBanks()">T1</button>
    <button class="filter-btn" onclick="bankTierFilter='T2';filterBanks()">T2</button>
    <button class="filter-btn" onclick="bankTierFilter='T3';filterBanks()">T3</button>
    <button class="filter-btn" onclick="bankTierFilter='T4';filterBanks()">T4</button>
  </div>
  <div id="bankList"></div>`;
  el.innerHTML = html;
  filterBanks();
}

let bankTierFilter = '';

function filterBanks() {
  const el = document.getElementById('bankList');
  let list = DATA.banks;
  if (bankFilter) {
    list = list.filter(b => b.name.includes(bankFilter));
  }
  if (bankTierFilter) {
    list = list.filter(b => b.tier === bankTierFilter);
  }
  let html = `<div style="font-size:12px;color:#999;margin-bottom:6px">共 ${list.length} 家银行</div>`;
  list.forEach(b => {
    html += `<div class="card" onclick="toggleBankProducts(this, '${b.name}')">
      <div class="name"><span class="tier-badge tier-${b.tier}">${b.tier}</span>${b.name} ${b.rate ? '<span style="font-size:11px;color:#4361ee">获贷率' + b.rate + '</span>' : ''}</div>
      <div class="meta">客户数 ${b.count} | 产品数 ${b.product_count}</div>
      <div class="bank-products" style="display:none" id="bp-${b.name}"></div>
    </div>`;
  });
  el.innerHTML = html;
}

function toggleBankProducts(card, bankName) {
  const box = document.getElementById('bp-' + bankName);
  if (!box) return;
  if (box.style.display === 'none' || !box.style.display) {
    // 找该银行的产品
    const prods = DATA.products.filter(p => p.bank === bankName);
    if (!prods.length) {
      box.innerHTML = '<div style="font-size:12px;color:#999;padding:8px">暂无产品数据</div>';
    } else {
      let html = '';
      prods.forEach(p => {
        const amt = p.amount_max ? (p.amount_max / 10000).toFixed(0) + '万' : '待确认';
        html += `<div class="product-card">
          <div class="pname">${p.product || '未命名'}</div>
          <div><span class="prate">${p.rate || '利率待定'}</span> | <span class="pamount">额度${amt}</span></div>
          ${p.type ? '<div style="font-size:11px;color:#666;margin-top:2px">' + p.type + '</div>' : ''}
        </div>`;
      });
      box.innerHTML = html;
    }
    box.style.display = 'block';
  } else {
    box.style.display = 'none';
  }
}

// ========== 智能匹配 ==========
function renderMatch(el) {
  el.innerHTML = `
  <div class="card">
    <div style="font-weight:600;margin-bottom:10px">🧠 智能匹配</div>
    <div class="form-grid">
      <div><label>年开票（万）</label><input type="number" id="m-income" value="1000"></div>
      <div><label>年纳税（万）</label><input type="number" id="m-tax" value="10"></div>
      <div><label>纳税等级</label><select id="m-tax-grade"><option value="">未知</option><option>A</option><option>B</option><option>M</option></select></div>
      <div><label>法人年龄</label><input type="number" id="m-age" value="40"></div>
      <div><label>机构数</label><input type="number" id="m-inst-count" value="3"></div>
      <div><label>负债总额（万）</label><input type="number" id="m-debt" value="500"></div>
      <div><label>近3月查询</label><input type="number" id="m-q3" value="3"></div>
      <div><label>近6月查询</label><input type="number" id="m-q6" value="6"></div>
      <div><label>信用卡使用率%</label><input type="number" id="m-cc" value="50"></div>
      <div><label>当前逾期</label><input type="number" id="m-overdue-cont" value="0"></div>
      <div><label>历史逾期</label><input type="number" id="m-overdue-cum" value="0"></div>
      <div><label>科技标签</label><select id="m-tech"><option value="">无</option><option value="1">有</option></select></div>
      <div><label>排除银行</label><input id="m-exclude" placeholder="逗号分隔"></div>
      <div><label>双签</label><select id="m-dual"><option value="1">可双签</option><option value="">不可</option></select></div>
    </div>
    <button class="btn" onclick="runMatch()">开始匹配</button>
    <div class="match-result" id="matchResult"></div>
  </div>`;
}

function runMatch() {
  const g = id => document.getElementById(id).value;
  const income = parseFloat(g('m-income')) || 0;
  const tax = parseFloat(g('m-tax')) || 0;
  const taxGrade = g('m-tax-grade');
  const age = parseInt(g('m-age')) || 0;
  const instCount = parseInt(g('m-inst-count')) || 0;
  const debt = parseFloat(g('m-debt')) || 0;
  const q3 = parseInt(g('m-q3')) || 0;
  const q6 = parseInt(g('m-q6')) || 0;
  const cc = parseInt(g('m-cc')) || 0;
  const overdueCont = parseInt(g('m-overdue-cont')) || 0;
  const overdueCum = parseInt(g('m-overdue-cum')) || 0;
  const hasTech = g('m-tech') === '1';
  const exclude = g('m-exclude').split(/[,，]/).map(s => s.trim()).filter(Boolean);
  const dual = g('m-dual') === '1';

  const tiers = DATA.rules.tiers || {};
  const rates = DATA.rules.rates || {};
  const tierBonus = { T1: 15, T2: 8, T3: 3, T4: 1 };

  const riskFatal = [];
  const riskWarn = [];
  if (overdueCont >= 3 || overdueCum >= 6) riskFatal.push('连三累六：命中致命红线');
  if (cc > 90) riskWarn.push('信用卡使用率 > 90%');
  if (income > 0 && debt > 0 && debt / income > 0.5) riskWarn.push('销贷比 > 50%');
  if (q6 > 12) riskWarn.push('近6月查询 > 12次');

  let resultHtml = '';
  riskFatal.forEach(r => resultHtml += `<div class="risk-fatal">❌ ${r}</div>`);
  riskWarn.forEach(r => resultHtml += `<div class="risk-warn">⚠️ ${r}</div>`);

  const matches = [];
  DATA.products.forEach(p => {
    if (exclude.some(e => p.bank.includes(e))) return;
    if (p.max_age && age > p.max_age) return;
    if (p.min_age && age < p.min_age) return;
    if (p.tech_required && !hasTech) return;
    if (p.inst_max && instCount > p.inst_max) return;
    if (p.query_6m_max && q6 > p.query_6m_max) return;
    if (p.query_3m_max && q3 > p.query_3m_max) return;
    if (p.min_tax && tax < p.min_tax / 10000) return;
    if (p.dual_sign_required && !dual) return;
    if (p.tax_grades && p.tax_grades.length && taxGrade && !p.tax_grades.includes(taxGrade)) return;

    let score = 50;
    score += tierBonus[tiers[p.bank]] || 0;
    if (hasTech && p.tech_required) score += 10;
    if (taxGrade === 'A') score += 5;
    if (q6 <= 6) score += 5;
    score -= Math.min(instCount * 2, 20);
    score -= Math.min(q6, 15);

    const reasons = [];
    if (tiers[p.bank]) reasons.push(tiers[p.bank] + '层级');
    if (rates[p.bank]) reasons.push('获贷率' + rates[p.bank]);
    if (p.tech_required && hasTech) reasons.push('科技匹配');
    if (p.rate_min) reasons.push('利率' + p.rate_min + '%起');

    matches.push({
      bank: p.bank, product: p.product, rate: p.rate,
      amount: p.amount_max ? (p.amount_max / 10000).toFixed(0) + '万' : '待确认',
      score, reason: reasons.join(' · ')
    });
  });

  matches.sort((a, b) => b.score - a.score);
  const top = matches.slice(0, 15);

  if (top.length) {
    resultHtml += `<div style="font-weight:600;margin:12px 0 6px">推荐产品（前15）</div>`;
    top.forEach((m, i) => {
      resultHtml += `<div class="match-item">
        <div class="bank">${i+1}. ${m.bank} · ${m.product}</div>
        <div class="product">${m.rate} | 额度${m.amount}</div>
        <div class="reason">${m.reason}</div>
      </div>`;
    });
  } else {
    resultHtml += '<div class="empty">没有匹配的产品</div>';
  }

  document.getElementById('matchResult').innerHTML = resultHtml;
}

// ========== 客户详情 ==========
function showDetail(name) {
  const client = DATA.clients.find(c => c.name === name);
  if (!client) return;
  const detail = DATA.details && DATA.details[name];

  let html = `<h3 style="margin-bottom:12px">${name}</h3>`;

  // 关键指标
  html += `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
    <div class="stat" style="flex:1;min-width:70px"><div class="num" style="font-size:16px">${client.income || 0}</div><div class="label">开票(万)</div></div>
    <div class="stat" style="flex:1;min-width:70px"><div class="num" style="font-size:16px">${client.debt_total || 0}</div><div class="label">负债(万)</div></div>
    <div class="stat" style="flex:1;min-width:70px"><div class="num" style="font-size:16px">${client.legal_age || '?'}</div><div class="label">年龄</div></div>
    <div class="stat" style="flex:1;min-width:70px"><div class="num" style="font-size:16px">${client.inst_count || 0}</div><div class="label">机构数</div></div>
  </div>`;

  if (client.phone) {
    html += `<a href="tel:${client.phone}" style="display:block;text-align:center;padding:10px;background:#e8f5e9;color:#2e7d32;border-radius:8px;margin-bottom:12px;text-decoration:none;font-weight:600">📞 ${client.phone}</a>`;
  }

  if (detail) {
    html += `<div class="detail-text">${detail}</div>`;
  } else {
    html += `<div class="detail-text">开票：${client.income || 0}万
纳税：${client.tax || 0}万
负债：${client.debt_total || 0}万
机构数：${client.inst_count || 0}家
法人年龄：${client.legal_age || '未知'}岁
双签：${client.is_dual_sign ? '是' : '否'}
科技标签：${client.tag || '无'}
信用卡使用率：${client.cc_usage || 0}%</div>`;
  }

  document.getElementById('detailContent').innerHTML = html;
  document.getElementById('detailModal').style.display = 'block';
}
