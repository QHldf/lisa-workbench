// ========== 数据完整性 ==========
function completenessHTML(name) {
  const d = DATA.completeness && DATA.completeness[name];
  if (!d) return '';
  const cls = d.p >= 80 ? 'completeness-full' : d.p >= 50 ? 'completeness-mid' : 'completeness-low';
  const label = d.missing.length ? '缺' + d.missing.join('、') : '完整';
  return `<span title="${label} (${d.s}/${d.t})" style="cursor:help">
    <span class="completeness"><span class="completeness-bar ${cls}" style="width:${d.p}%"></span></span>
    <span style="font-size:11px;color:#999">${label}</span>
  </span>`;
}

// ========== 状态选择器 ==========
function statusSelect(name, current) {
  const opts = ['', '紧急', '推进中', '待反馈', '暂停', '已完成'];
  let html = `<select class="status-select" onchange="updateStatus('${name}',this.value)">
    <option value="">${current || '—'}</option>`;
  opts.forEach(s => {
    if (s !== current) html += `<option value="${s}">${s}</option>`;
  });
  html += '</select>';
  return html;
}

function updateStatus(name, status) {
  const c = DATA.clients.find(c => c.name === name);
  if (c) c.status = status;
  // 更新active列表
  DATA.active = DATA.clients.filter(c => c.status);
  // 刷新当前tab
  const active = document.querySelector('.tab.active');
  if (active) renderTab(active.dataset.tab);
}

// ========== 今日作战 ==========
function renderToday(el) {
  if (!DATA.active.length) { el.innerHTML = '<div class="empty">暂无在做客户</div>'; return; }
  let html = '';
  const groups = {'紧急':[], '推进中':[], '待反馈':[], '暂停':[], '已完成':[]};
  DATA.active.forEach(c => {
    const g = groups[c.status] ? c.status : '推进中';
    groups[g].push(c);
  });
  for (const [status, list] of Object.entries(groups)) {
    if (!list.length) continue;
    const cls = status==='紧急'?'badge-urgent':status==='推进中'?'badge-active':status==='待反馈'?'badge-wait':status==='已完成'?'badge-active':'badge-pause';
    html += `<div style="margin:8px 0 4px"><span class="badge ${cls}">${status} (${list.length})</span></div>`;
    list.forEach(c => {
      const rec = DATA.recommendations && DATA.recommendations[c.name];
      html += `<div class="card">
        <div class="name" onclick="showDetail('${c.name}')">${c.name}</div>
        <div class="meta">💰 开票${c.income || 0}万 | ${c.tag || '无标签'}</div>
        <div style="margin-top:4px">
          ${completenessHTML(c.name)}
          <span class="btn-sm edit" onclick="event.stopPropagation();showDetail('${c.name}')">📋 详情</span>
          <span class="btn-sm scheme" onclick="event.stopPropagation();showScheme('${c.name}')">📄 出方案</span>
          ${statusSelect(c.name, c.status)}
        </div>
        ${rec ? '<div class="rec-list">推荐: ' + rec.slice(0,4).map((b,i) => '<span class="rec-rank t'+(i+1)+'">'+(i+1)+'</span>'+b).join(' ') + '</div>' : ''}
      </div>`;
    });
  }
  el.innerHTML = html;
}

// ========== 客户档案 ==========
let clientFilter = { search: '', sort: 'income', active: false };
const SORT_MODES = [
  { key: 'income', label: '全部', desc: '按开票金额排序' },
  { key: 'biztax', label: '开票纳税', desc: '按开票和纳税排序' },
  { key: 'inst', label: '机构数', desc: '按企业负债机构数排序' },
  { key: 'tag', label: '标签', desc: '仅显示有标签客户' },
  { key: 'active', label: '在做', desc: '仅显示在做客户' }
];

function renderClients(el) {
  let html = `<input class="search" placeholder="🔍 搜索客户名称..." oninput="clientFilter.search=this.value;filterClients()">
  <div class="filter-row" id="sortModeBtns"></div>
  <div id="clientList"></div>`;
  el.innerHTML = html;
  const sb = document.getElementById('sortModeBtns');
  sb.innerHTML = SORT_MODES.map(m => 
    `<button class="filter-btn ${m.key === 'income' ? 'active' : ''}" data-key="${m.key}" onclick="setSortMode('${m.key}')">${m.label}</button>`
  ).join('');
  filterClients();
}

function setSortMode(key) {
  clientFilter.sort = key;
  document.querySelectorAll('#sortModeBtns .filter-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.key === key);
  });
  filterClients();
}

function filterClients() {
  const el = document.getElementById('clientList');
  let list = [...DATA.clients];
  const mode = clientFilter.sort;
  if (clientFilter.search) {
    const s = clientFilter.search.toLowerCase();
    list = list.filter(c => c.name.toLowerCase().includes(s));
  }
  if (mode === 'tag') {
    list = list.filter(c => c.has_tech);
    list.sort((a, b) => (b.income || 0) - (a.income || 0));
  } else if (mode === 'inst') {
    list.sort((a, b) => (b.biz_inst_count || 0) - (a.biz_inst_count || 0));
  } else if (mode === 'active') {
    list = list.filter(c => c.status);
    list.sort((a, b) => (b.income || 0) - (a.income || 0));
  } else {
    list.sort((a, b) => (b.income || 0) - (a.income || 0));
  }
  if (!list.length) { el.innerHTML = '<div class="empty">没有匹配的客户</div>'; return; }
  let html = `<div style="font-size:12px;color:#999;margin-bottom:6px">共 ${list.length} 家</div>`;
  list.forEach(c => {
    const statusBadge = c.status ? `<span class="badge ${c.status==='紧急'?'badge-urgent':c.status==='推进中'?'badge-active':'badge-wait'}">${c.status}</span>` : '';
    let metaHtml = '';
    if (mode === 'biztax') {
      metaHtml = `💰 开票${c.income || 0}万 | 纳税${c.tax || 0}万`;
    } else if (mode === 'inst') {
      metaHtml = `🏢 机构数${c.biz_inst_count || 0}家 | 💰 开票${c.income || 0}万`;
    } else if (mode === 'tag') {
      metaHtml = `🏷️ ${c.tag || '有标签'} | 💰 开票${c.income || 0}万`;
    } else {
      metaHtml = `💰 ${c.income || 0}万 | 负债${c.debt_total || 0}万 | ${c.legal_age || '?'}岁${c.tax_grade ? ' | 纳税' + c.tax_grade + '级' : ''}`;
    }
    html += `<div class="card">
      <div class="name" onclick="showDetail('${c.name}')">${c.name} ${statusBadge}</div>
      <div class="meta">${metaHtml}</div>
      <div style="margin-top:4px">
        ${completenessHTML(c.name)}
        <span class="btn-sm scheme" onclick="event.stopPropagation();showScheme('${c.name}')">📄 出方案</span>
        ${statusSelect(c.name, c.status)}
      </div>
    </div>`;
  });
  el.innerHTML = html;
}

function filterBanks() {
  const el = document.getElementById('bankList');
  let list = DATA.banks;
  if (bankFilter) list = list.filter(b => b.name.includes(bankFilter));
  if (bankTierFilter) list = list.filter(b => b.tier === bankTierFilter);
  let html = `<div style="font-size:12px;color:#999;margin-bottom:6px">共 ${list.length} 家银行</div>`;
  list.forEach(b => {
    const pCount = b.products ? b.products.length : 0;
    html += `<div class="card" onclick="toggleBankProducts(this,'${b.name}')">
      <div class="name"><span class="tier-badge tier-${b.tier}">${b.tier}</span>${b.name} ${b.rate ? '<span style="font-size:11px;color:#4361ee">获贷率' + b.rate + '</span>' : ''}</div>

      <div class="bank-products" style="display:none" id="bp-${b.name.replace(/\s/g,'')}"></div>
    </div>`;
  });
  el.innerHTML = html;
}

function toggleBankProducts(card, bankName) {
  const id = 'bp-' + bankName.replace(/\s/g,'');
  const box = document.getElementById(id);
  if (!box) return;
  if (box.style.display === 'none') {
    const prods = DATA.products.filter(p => p.bank === bankName);
    if (!prods.length) {
      box.innerHTML = '<div style="font-size:12px;color:#999;padding:8px">暂无产品数据</div>';
    } else {
      let html = '';
      prods.forEach(p => {
        const amt = p.amount_max ? (p.amount_max / 10000).toFixed(0) + '万' : '待确认';
        html += `<div class="product-card">
          <div class="pname">${p.product || '未命名'}</div>
          <div><span class="prate">${p.rate || '利率待定'}</span> | <span class="pamount">额度${amt}</span></div>
          ${p.type ? '<div style="font-size:11px;color:#666;margin-top:2px">' + p.type + '</div>' : ''}
        </div>`;
      });
      box.innerHTML = html;
    }
    box.style.display = 'block';
  } else {
    box.style.display = 'none';
  }
}

      <div><label>纳税等级</label><select id="m-tax-grade"><option value="">未知</option><option>A</option><option>B</option><option>M</option></select></div>
      <div><label>法人年龄</label><input type="number" id="m-age" value="40"></div>
      <div><label>机构数</label><input type="number" id="m-inst-count" value="3"></div>
      <div><label>负债总额（万）</label><input type="number" id="m-debt" value="500"></div>
      <div><label>近3月查询</label><input type="number" id="m-q3" value="3"></div>
      <div><label>近6月查询</label><input type="number" id="m-q6" value="6"></div>
      <div><label>信用卡使用率%</label><input type="number" id="m-cc" value="50"></div>
      <div><label>科技标签</label><select id="m-tech"><option value="">无</option><option value="1">有</option></select></div>
      <div><label>排除银行</label><input id="m-exclude" placeholder="逗号分隔"></div>
      <div><label>双签</label><select id="m-dual"><option value="1">可双签</option><option value="">不可</option></select></div>
    </div>
    <button class="btn" onclick="runMatch()">开始匹配</button>
    <div class="match-result" id="matchResult"></div>
  </div>`;
}

function runMatch() {
  const g = id => document.getElementById(id).value;
  const income = parseFloat(g('m-income')) || 0;
  const tax = parseFloat(g('m-tax')) || 0;
  const taxGrade = g('m-tax-grade');
  const age = parseInt(g('m-age')) || 0;
  const instCount = parseInt(g('m-inst-count')) || 0;
  const debt = parseFloat(g('m-debt')) || 0;
  const q3 = parseInt(g('m-q3')) || 0;
  const q6 = parseInt(g('m-q6')) || 0;
  const cc = parseInt(g('m-cc')) || 0;
  const hasTech = g('m-tech') === '1';
  const exclude = g('m-exclude').split(/[,，]/).map(s => s.trim()).filter(Boolean);
  const dual = g('m-dual') === '1';
  const tiers = DATA.rules.tiers || {};
  const tierBonus = { T1: 15, T2: 8, T3: 3, T4: 1 };
  const riskWarn = [];
  if (cc > 90) riskWarn.push('信用卡使用率 > 90%');
  if (income > 0 && debt > 0 && debt / income > 0.5) riskWarn.push('销贷比 > 50%');
  if (q6 > 12) riskWarn.push('近6月查询 > 12次');
  let resultHtml = '';
  riskWarn.forEach(r => resultHtml += '<div class="risk-warn">⚠️ ' + r + '</div>');
  const matches = [];
  DATA.products.forEach(p => {
    if (exclude.some(e => p.bank.includes(e))) return;
    if (p.max_age && age > p.max_age) return;
    if (p.min_age && age < p.min_age) return;
    if (p.tech_required && !hasTech) return;
    if (p.inst_max && instCount > p.inst_max) return;
    if (p.query_6m_max && q6 > p.query_6m_max) return;
    if (p.query_3m_max && q3 > p.query_3m_max) return;
    if (p.min_tax && tax < p.min_tax / 10000) return;
    if (p.dual_sign_required && !dual) return;
    if (p.tax_grades && p.tax_grades.length && taxGrade && !p.tax_grades.includes(taxGrade)) return;
    let score = 50;
    score += tierBonus[tiers[p.bank]] || 0;
    if (hasTech && p.tech_required) score += 10;
    if (taxGrade === 'A') score += 5;
    if (q6 <= 6) score += 5;
    score -= Math.min(instCount * 2, 20);
    const reasons = [];
    if (tiers[p.bank]) reasons.push(tiers[p.bank] + '层级');
    if (p.tech_required && hasTech) reasons.push('科技匹配');
    if (p.rate_min) reasons.push('利率' + p.rate_min + '%起');
    matches.push({
      bank: p.bank, product: p.product, rate: p.rate,
      amount: p.amount_max ? (p.amount_max / 10000).toFixed(0) + '万' : '待确认',
      score, reason: reasons.join(' · ')
    });
  });
  matches.sort((a, b) => b.score - a.score);
  const top = matches.slice(0, 15);
  if (top.length) {
    resultHtml += '<div style="font-weight:600;margin:12px 0 6px">推荐产品（前15）</div>';
    top.forEach((m, i) => {
      resultHtml += '<div class="match-item"><div class="bank">' + (i+1) + '. ' + m.bank + ' · ' + m.product + '</div><div class="product">' + m.rate + ' | 额度' + m.amount + '</div><div class="reason">' + m.reason + '</div></div>';
    });
  } else {
    resultHtml += '<div class="empty">没有匹配的产品</div>';
  }
  document.getElementById('matchResult').innerHTML = resultHtml;
}

// ========== 出方案 ==========
function showScheme(name) {
  const client = DATA.clients.find(c => c.name === name);
  if (!client) return;
  const recs = DATA.recommendations && DATA.recommendations[name];
  const allInsts = client.all_institutions || [];
  const comp = DATA.completeness && DATA.completeness[name];

  let html = `<h3 style="margin-bottom:12px">📄 ${name} · 落实建议</h3>`;

  // 数据完整性
  if (comp && comp.missing.length) {
    html += '<div class="risk-warn">⚠️ 缺失数据: ' + comp.missing.join('、') + '（影响推荐准确性）</div>';
  }

  // 客户关键数据
  html += `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;font-size:12px">
    <span>💰 开票${client.income || 0}万</span>
    <span>| 负债${client.debt_total || 0}万</span>
    <span>| ${client.legal_age || '?'}岁</span>
    <span>| ${client.inst_count || 0}家机构</span>
    <span>| ${client.is_dual_sign ? '可双签' : '单签'}</span>
    ${client.tax_grade ? '| 纳税'+client.tax_grade+'级' : ''}
  </div>`;

  // 存量银行
  if (allInsts.length) {
    html += '<div style="margin-bottom:10px;font-size:12px;color:#666">已有贷款银行: ' + [...new Set(allInsts)].join('、') + '</div>';
  }

  // 推荐方案
  if (recs && recs.length) {
    const tiers = { T1: '首选', T2: '次选', T3: '补充', T4: '可选' };
    html += '<div style="font-weight:600;margin-bottom:6px">推荐申请顺序：</div>';
    recs.forEach((bank, i) => {
      const tier = DATA.rules.tiers && DATA.rules.tiers[bank];
      const rate = DATA.rules.rates && DATA.rules.rates[bank];
      const tierName = tiers[tier] || '可选';
      const num = i + 1;
      html += '<div class="match-item" style="margin-bottom:4px;padding:8px">';
      html += '<div class="bank">' + num + '. ' + bank + ' <span class="tier-badge tier-' + tier + '">' + tierName + '</span>' + (rate ? ' <span style="font-size:11px;color:#4361ee">获贷率' + rate + '</span>' : '') + '</div>';
      // 找该银行的产品
      const prods = DATA.products.filter(p => p.bank === bank).slice(0, 2);
      if (prods.length) {
        html += '<div class="product">推荐产品: ' + prods.map(p => p.product).join('、') + '</div>';
        html += '<div class="reason">利率' + prods[0].rate + ' | 额度' + (prods[0].amount_max ? (prods[0].amount_max/10000).toFixed(0)+'万' : '待确认') + '</div>';
      }
      html += '</div>';
    });
  } else {
    html += '<div class="empty">暂无推荐方案</div>';
  }

  document.getElementById('detailContent').innerHTML = html;
  document.getElementById('detailModal').style.display = 'block';
}

// ========== 客户详情 ==========
function showDetail(name) {
  const detail = DATA.details && DATA.details[name];
  const client = DATA.clients.find(c => c.name === name);
  if (!client) return;

  let html = `<h3 style="margin-bottom:12px">${name}</h3>`;

  // 关键指标卡片
  html += `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
    <div class="stat" style="flex:1;min-width:70px;padding:8px"><div class="num" style="font-size:16px">${client.income || 0}</div><div class="label">开票(万)</div></div>
    <div class="stat" style="flex:1;min-width:70px;padding:8px"><div class="num" style="font-size:16px">${client.debt_total || 0}</div><div class="label">负债(万)</div></div>
    <div class="stat" style="flex:1;min-width:70px;padding:8px"><div class="num" style="font-size:16px">${client.legal_age || '?'}</div><div class="label">年龄</div></div>
    <div class="stat" style="flex:1;min-width:70px;padding:8px"><div class="num" style="font-size:16px">${client.inst_count || 0}</div><div class="label">机构数</div></div>
  </div>`;

  // 操作按钮
  html += `<div style="margin-bottom:12px">
    <span class="btn-sm scheme" onclick="document.getElementById('detailModal').style.display='none';setTimeout(()=>showScheme('${name}'),100)">📄 出方案</span>
  </div>`;

  // 完整档案文本
  if (detail) {
    html += '<div class="detail-text">' + detail + '</div>';
  }

  document.getElementById('detailContent').innerHTML = html;
  document.getElementById('detailModal').style.display = 'block';
}

</script>
