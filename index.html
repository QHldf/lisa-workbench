
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lisa · 融资顾问作战台</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f0f2f5;color:#1a1a2e;font-size:14px;padding-bottom:20px}
.header{background:linear-gradient(135deg,#1a1a2e,#16213e);color:#fff;padding:16px;position:sticky;top:0;z-index:100}
.header h1{font-size:18px;font-weight:600}
.header .sub{font-size:12px;opacity:.7;margin-top:4px}
.stats{display:flex;gap:8px;padding:12px 16px;flex-wrap:wrap}
.stat{background:#fff;border-radius:10px;padding:10px 14px;flex:1;min-width:80px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.stat .num{font-size:22px;font-weight:700;color:#4361ee}
.stat .label{font-size:11px;color:#666;margin-top:2px}
.tabs{display:flex;gap:4px;padding:0 16px;margin-bottom:12px;overflow-x:auto}
.tab{padding:8px 16px;border-radius:20px;background:#fff;font-size:13px;white-space:nowrap;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.06);border:1px solid #e0e0e0;user-select:none}
.tab.active{background:#4361ee;color:#fff;border-color:#4361ee}
.content{padding:0 16px}
.card{background:#fff;border-radius:10px;padding:12px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.06);position:relative}
.card .name{font-weight:600;font-size:14px;color:#1a1a2e;cursor:pointer}
.card .name:hover{color:#4361ee}
.card .meta{font-size:12px;color:#666;margin-top:4px;line-height:1.5}
.card .tag{display:inline-block;padding:1px 6px;border-radius:4px;font-size:11px;margin:2px 2px 0 0}
.tag-tech{background:#e8f5e9;color:#2e7d32}
.tag-none{background:#f5f5f5;color:#999}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge-urgent{background:#ffebee;color:#c62828}
.badge-active{background:#e3f2fd;color:#1565c0}
.badge-wait{background:#fff8e1;color:#f57f17}
.badge-pause{background:#f5f5f5;color:#757575}
.search{width:100%;padding:10px 14px;border:1px solid #e0e0e0;border-radius:10px;font-size:14px;margin-bottom:12px;background:#fff}
.filter-row{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.filter-btn{padding:4px 10px;border-radius:14px;font-size:12px;border:1px solid #ddd;background:#fff;cursor:pointer;user-select:none}
.filter-btn.active{background:#4361ee;color:#fff;border-color:#4361ee}
.tier-badge{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:700;margin-right:4px}
.tier-T1{background:#e8f5e9;color:#2e7d32}
.tier-T2{background:#e3f2fd;color:#1565c0}
.tier-T3{background:#fff3e0;color:#e65100}
.tier-T4{background:#f5f5f5;color:#9e9e9e}
.product-card{background:#f8f9fa;border-radius:8px;padding:10px;margin:6px 0;font-size:12px}
.product-card .pname{font-weight:600;color:#1a1a2e}
.product-card .prate{color:#4361ee;font-weight:600}
.empty{text-align:center;padding:40px;color:#999;font-size:14px}
.modal-mask{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:200;overflow-y:auto}
.modal-box{background:#fff;margin:20px 16px;border-radius:12px;padding:16px;max-height:85vh;overflow-y:auto}
.modal-close{float:right;font-size:24px;color:#999;cursor:pointer;padding:4px 8px}
.detail-text{font-size:13px;line-height:1.8;white-space:pre-wrap;word-break:break-all}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.form-grid label{font-size:12px;color:#666;display:block;margin-bottom:2px}
.form-grid input,.form-grid select{width:100%;padding:8px;border:1px solid #ddd;border-radius:8px;font-size:13px}
.btn{display:block;width:100%;padding:12px;background:#4361ee;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;margin-top:12px;text-align:center}
.btn:active{opacity:.8}
.btn-sm{display:inline-block;padding:4px 10px;border-radius:6px;font-size:11px;cursor:pointer;margin-left:6px}
.btn-sm.action{background:#e8f5e9;color:#2e7d32}
.btn-sm.edit{background:#e3f2fd;color:#1565c0}
.btn-sm.scheme{background:#fff3e0;color:#e65100}
.match-item{background:#f8f9fa;border-radius:8px;padding:10px;margin-bottom:6px;border-left:3px solid #4361ee}
.match-item .bank{font-weight:600;font-size:14px}
.match-item .product{font-size:12px;color:#666;margin-top:2px}
.risk-fatal{background:#ffebee;border-left:3px solid #c62828;padding:8px;border-radius:6px;margin:4px 0;font-size:12px;color:#c62828}
.risk-warn{background:#fff3e0;border-left:3px solid #e65100;padding:8px;border-radius:6px;margin:4px 0;font-size:12px;color:#e65100}
.completeness{display:inline-block;width:60px;height:6px;background:#e0e0e0;border-radius:3px;vertical-align:middle;margin-right:4px}
.completeness-bar{height:100%;border-radius:3px;transition:width .3s}
.completeness-full{background:#4caf50}
.completeness-mid{background:#ff9800}
.completeness-low{background:#f44336}
.rec-list{font-size:12px;color:#666;margin-top:4px;line-height:1.6}
.rec-rank{display:inline-block;width:18px;height:18px;border-radius:50%;background:#4361ee;color:#fff;font-size:10px;text-align:center;line-height:18px;margin-right:4px}
.rec-rank.t1{background:#2e7d32}
.rec-rank.t2{background:#1565c0}
.rec-rank.t3{background:#e65100}
.rec-rank.t4{background:#9e9e9e}
.status-select{font-size:12px;padding:2px 6px;border-radius:4px;border:1px solid #ddd;cursor:pointer}
.update-time{text-align:center;font-size:11px;color:#999;padding:8px}
.news-item{background:#f8f9fa;border-radius:8px;padding:8px;margin:4px 0;font-size:12px;border-left:3px solid #4361ee}
.news-item .ntitle{font-weight:600;color:#1a1a2e;cursor:pointer}
.news-item .ntitle:hover{color:#4361ee}
.news-item .nmeta{font-size:11px;color:#999;margin-top:2px}
.checkbox-row label{font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;padding:4px 0}
@media(min-width:768px){.content,.stats{max-width:800px;margin:0 auto}}
</style>
</head>
<body>
<div class="header">
  <h1>Lisa · 融资顾问作战台</h1>
  <div class="sub">企业银行融资智能匹配系统 · 更新于 2026-08-05 02:00</div>
</div>

<div class="stats" id="statsBar"></div>

<div class="tabs">
  <div class="tab active" data-tab="today">🏠 今日作战</div>
  <div class="tab" data-tab="clients">📁 客户档案</div>
  <div class="tab" data-tab="banks">🏦 银行地图</div>
  <div class="tab" data-tab="match">🧠 智能匹配</div>
</div>

<div class="content" id="mainContent"></div>

<div class="modal-mask" id="detailModal" onclick="if(event.target===this)this.style.display='none'">
  <div class="modal-box">
    <span class="modal-close" onclick="document.getElementById('detailModal').style.display='none'">×</span>
    <div id="detailContent"></div>
  </div>
</div>

<div class="update-time">数据更新时间: 2026-08-05 04:25 · 100客户 · 67银行 · 246产品</div>

<script>
const DATA = {data_json};

document.addEventListener('DOMContentLoaded', function() {{
  renderStats();
  renderTab('today');
  document.querySelector('.tabs').addEventListener('click', function(e) {{
    if (e.target.classList.contains('tab')) {{
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      e.target.classList.add('active');
      renderTab(e.target.dataset.tab);
    }}
  }});
}});

function renderStats() {{
  const el = document.getElementById('statsBar');
  const urgent = DATA.active.filter(c => c.status === '紧急').length;
  el.innerHTML = `
    <div class="stat"><div class="num">${{DATA.clients.length}}</div><div class="label">总客户</div></div>
    <div class="stat"><div class="num">${{DATA.active.length}}</div><div class="label">在做</div></div>
    <div class="stat"><div class="num">${{DATA.banks.length}}</div><div class="label">银行</div></div>
    <div class="stat"><div class="num" style="color:#c62828">${{urgent}}</div><div class="label">紧急</div></div>
    <div class="stat"><div class="num">${{DATA.products.length}}</div><div class="label">产品</div></div>
  `;
}}

function renderTab(tab) {{
  const el = document.getElementById('mainContent');
  switch(tab) {{
    case 'today': renderToday(el); break;
    case 'clients': renderClients(el); break;
    case 'banks': renderBanks(el); break;
    case 'match': renderMatch(el); break;
  }}
}}

// ========== 数据完整性 ==========
function completenessHTML(name) {{
  const d = DATA.completeness && DATA.completeness[name];
  if (!d) return '';
  const cls = d.p >= 80 ? 'completeness-full' : d.p >= 50 ? 'completeness-mid' : 'completeness-low';
  const label = d.missing.length ? '缺' + d.missing.join('、') : '完整';
  return `<span title="${{label}} (${{d.s}}/${{d.t}})" style="cursor:help">
    <span class="completeness"><span class="completeness-bar ${{cls}}" style="width:${{d.p}}%"></span></span>
    <span style="font-size:11px;color:#999">${{label}}</span>
  </span>`;
}}

// ========== 状态选择器 ==========
function statusSelect(name, current) {{
  const opts = ['', '紧急', '推进中', '待反馈', '暂停', '已完成'];
  let html = `<select class="status-select" onchange="updateStatus('${{name}}',this.value)">
    <option value="">${{current || '—'}}</option>`;
  opts.forEach(s => {{
    if (s !== current) html += `<option value="${{s}}">${{s}}</option>`;
  }});
  html += '</select>';
  return html;
}}

function updateStatus(name, status) {{
  const c = DATA.clients.find(c => c.name === name);
  if (c) c.status = status;
  // 更新active列表
  DATA.active = DATA.clients.filter(c => c.status);
  // 刷新当前tab
  const active = document.querySelector('.tab.active');
  if (active) renderTab(active.dataset.tab);
}}

// ========== 今日作战 ==========
function renderToday(el) {{
  if (!DATA.active.length) {{ el.innerHTML = '<div class="empty">暂无在做客户</div>'; return; }}
  let html = '';
  const groups = {{'紧急':[], '推进中':[], '待反馈':[], '暂停':[], '已完成':[]}};
  DATA.active.forEach(c => {{
    const g = groups[c.status] ? c.status : '推进中';
    groups[g].push(c);
  }});
  for (const [status, list] of Object.entries(groups)) {{
    if (!list.length) continue;
    const cls = status==='紧急'?'badge-urgent':status==='推进中'?'badge-active':status==='待反馈'?'badge-wait':status==='已完成'?'badge-active':'badge-pause';
    html += `<div style="margin:8px 0 4px"><span class="badge ${{cls}}">${{status}} (${{list.length}})</span></div>`;
    list.forEach(c => {{
      const rec = DATA.recommendations && DATA.recommendations[c.name];
      html += `<div class="card">
        <div class="name" onclick="showDetail('${{c.name}}')">${{c.name}}</div>
        <div class="meta">💰 开票${{c.income || 0}}万 | ${{c.tag || '无标签'}}</div>
        <div style="margin-top:4px">
          ${{completenessHTML(c.name)}}
          <span class="btn-sm edit" onclick="event.stopPropagation();showDetail('${{c.name}}')">📋 详情</span>
          <span class="btn-sm scheme" onclick="event.stopPropagation();showScheme('${{c.name}}')">📄 出方案</span>
          ${{statusSelect(c.name, c.status)}}
        </div>
        ${{rec ? '<div class="rec-list">推荐: ' + rec.slice(0,4).map((b,i) => '<span class="rec-rank t'+(i+1)+'">'+(i+1)+'</span>'+b).join(' ') + '</div>' : ''}}
      </div>`;
    }});
  }}
  el.innerHTML = html;
}}

// ========== 客户档案 ==========
let clientFilter = {{ search: '', sort: 'income', active: false }};
const SORT_MODES = [
  {{ key: 'income', label: '全部', desc: '按开票金额排序' }},
  {{ key: 'biztax', label: '开票纳税', desc: '按开票和纳税排序' }},
  {{ key: 'inst', label: '机构数', desc: '按企业负债机构数排序' }},
  {{ key: 'tag', label: '标签', desc: '仅显示有标签客户' }},
  {{ key: 'active', label: '在做', desc: '仅显示在做客户' }}
];

function renderClients(el) {{
  let html = `<input class="search" placeholder="🔍 搜索客户名称..." oninput="clientFilter.search=this.value;filterClients()">
  <div class="filter-row" id="sortModeBtns"></div>
  <div id="clientList"></div>`;
  el.innerHTML = html;
  const sb = document.getElementById('sortModeBtns');
  sb.innerHTML = SORT_MODES.map(m => 
    `<button class="filter-btn ${{m.key === 'income' ? 'active' : ''}}" data-key="${{m.key}}" onclick="setSortMode('${{m.key}}')">${{m.label}}</button>`
  ).join('');
  filterClients();
}}

function setSortMode(key) {{
  clientFilter.sort = key;
  document.querySelectorAll('#sortModeBtns .filter-btn').forEach(b => {{
    b.classList.toggle('active', b.dataset.key === key);
  }});
  filterClients();
}}

function filterClients() {{
  const el = document.getElementById('clientList');
  let list = [...DATA.clients];
  const mode = clientFilter.sort;
  if (clientFilter.search) {{
    const s = clientFilter.search.toLowerCase();
    list = list.filter(c => c.name.toLowerCase().includes(s));
  }}
  if (mode === 'tag') {{
    list = list.filter(c => c.has_tech);
    list.sort((a, b) => (b.income || 0) - (a.income || 0));
  }} else if (mode === 'inst') {{
    list.sort((a, b) => (b.biz_inst_count || 0) - (a.biz_inst_count || 0));
  }} else if (mode === 'active') {{
    list = list.filter(c => c.status);
    list.sort((a, b) => (b.income || 0) - (a.income || 0));
  }} else {{
    list.sort((a, b) => (b.income || 0) - (a.income || 0));
  }}
  if (!list.length) {{ el.innerHTML = '<div class="empty">没有匹配的客户</div>'; return; }}
  let html = `<div style="font-size:12px;color:#999;margin-bottom:6px">共 ${{list.length}} 家</div>`;
  list.forEach(c => {{
    const statusBadge = c.status ? `<span class="badge ${{c.status==='紧急'?'badge-urgent':c.status==='推进中'?'badge-active':'badge-wait'}}">${{c.status}}</span>` : '';
    let metaHtml = '';
    if (mode === 'biztax') {{
      metaHtml = `💰 开票${{c.income || 0}}万 | 纳税${{c.tax || 0}}万`;
    }} else if (mode === 'inst') {{
      metaHtml = `🏢 机构数${{c.biz_inst_count || 0}}家 | 💰 开票${{c.income || 0}}万`;
    }} else if (mode === 'tag') {{
      metaHtml = `🏷️ ${{c.tag || '有标签'}} | 💰 开票${{c.income || 0}}万`;
    }} else {{
      metaHtml = `💰 ${{c.income || 0}}万 | 负债${{c.debt_total || 0}}万 | ${{c.legal_age || '?'}}岁${{c.tax_grade ? ' | 纳税' + c.tax_grade + '级' : ''}}`;
    }}
    html += `<div class="card">
      <div class="name" onclick="showDetail('${{c.name}}')">${{c.name}} ${{statusBadge}}</div>
      <div class="meta">${{metaHtml}}</div>
      <div style="margin-top:4px">
        ${{completenessHTML(c.name)}}
        <span class="btn-sm scheme" onclick="event.stopPropagation();showScheme('${{c.name}}')">📄 出方案</span>
        ${{statusSelect(c.name, c.status)}}
      </div>
    </div>`;
  }});
  el.innerHTML = html;
}}

// ========== 银行地图 ==========
let bankFilter = '', bankTierFilter = '';

function renderBanks(el) {{
  let html = `<input class="search" placeholder="🔍 搜索银行..." oninput="bankFilter=this.value;filterBanks()">
  <div class="filter-row">
    <button class="filter-btn active" onclick="bankTierFilter='';filterBanks()">全部</button>
    <button class="filter-btn" onclick="bankTierFilter='T1';filterBanks()">T1</button>
    <button class="filter-btn" onclick="bankTierFilter='T2';filterBanks()">T2</button>
    <button class="filter-btn" onclick="bankTierFilter='T3';filterBanks()">T3</button>
    <button class="filter-btn" onclick="bankTierFilter='T4';filterBanks()">T4</button>
  </div>
  <div id="bankList"></div>`;
  el.innerHTML = html;
  filterBanks();
}}

function filterBanks() {{
  const el = document.getElementById('bankList');
  let list = DATA.banks;
  if (bankFilter) list = list.filter(b => b.name.includes(bankFilter));
  if (bankTierFilter) list = list.filter(b => b.tier === bankTierFilter);
  let html = `<div style="font-size:12px;color:#999;margin-bottom:6px">共 ${{list.length}} 家银行</div>`;
  list.forEach(b => {{
    const pCount = b.products ? b.products.length : 0;
    html += `<div class="card" onclick="toggleBankProducts(this,'${{b.name}}')">
      <div class="name"><span class="tier-badge tier-${{b.tier}}">${{b.tier}}</span>${{b.name}} ${{b.rate ? '<span style="font-size:11px;color:#4361ee">获贷率' + b.rate + '</span>' : ''}}</div>
      <div class="meta">客户数 ${{b.count}} | 产品数 ${{pCount}}</div>
      <div class="bank-products" style="display:none" id="bp-${{b.name.replace(/\s/g,'')}}"></div>
    </div>`;
  }});
  el.innerHTML = html;
}}

function toggleBankProducts(card, bankName) {{
  const id = 'bp-' + bankName.replace(/\s/g,'');
  const box = document.getElementById(id);
  if (!box) return;
  if (box.style.display === 'none') {{
    const prods = DATA.products.filter(p => p.bank === bankName);
    if (!prods.length) {{
      box.innerHTML = '<div style="font-size:12px;color:#999;padding:8px">暂无产品数据</div>';
    }} else {{
      let html = '';
      prods.forEach(p => {{
        const amt = p.amount_max ? (p.amount_max / 10000).toFixed(0) + '万' : '待确认';
        html += `<div class="product-card">
          <div class="pname">${{p.product || '未命名'}}</div>
          <div><span class="prate">${{p.rate || '利率待定'}}</span> | <span class="pamount">额度${{amt}}</span></div>
          ${{p.type ? '<div style="font-size:11px;color:#666;margin-top:2px">' + p.type + '</div>' : ''}}
        </div>`;
      }});
      box.innerHTML = html;
    }}
    box.style.display = 'block';
  }} else {{
    box.style.display = 'none';
  }}
}}

// ========== 智能匹配 ==========
function renderMatch(el) {{
  el.innerHTML = `
  <div class="card">
    <div style="font-weight:600;margin-bottom:10px">🧠 智能匹配 · 输入客户条件匹配银行产品</div>
    <div class="form-grid">
      <div><label>年开票（万）</label><input type="number" id="m-income" value="1000"></div>
      <div><label>年纳税（万）</label><input type="number" id="m-tax" value="10"></div>
      <div><label>纳税等级</label><select id="m-tax-grade"><option value="">未知</option><option>A</option><option>B</option><option>M</option></select></div>
      <div><label>法人年龄</label><input type="number" id="m-age" value="40"></div>
      <div><label>机构数</label><input type="number" id="m-inst-count" value="3"></div>
      <div><label>负债总额（万）</label><input type="number" id="m-debt" value="500"></div>
      <div><label>近3月查询</label><input type="number" id="m-q3" value="3"></div>
      <div><label>近6月查询</label><input type="number" id="m-q6" value="6"></div>
      <div><label>信用卡使用率%</label><input type="number" id="m-cc" value="50"></div>
      <div><label>科技标签</label><select id="m-tech"><option value="">无</option><option value="1">有</option></select></div>
      <div><label>排除银行</label><input id="m-exclude" placeholder="逗号分隔"></div>
      <div><label>双签</label><select id="m-dual"><option value="1">可双签</option><option value="">不可</option></select></div>
    </div>
    <button class="btn" onclick="runMatch()">开始匹配</button>
    <div class="match-result" id="matchResult"></div>
  </div>`;
}}

function runMatch() {{
  const g = id => document.getElementById(id).value;
  const income = parseFloat(g('m-income')) || 0;
  const tax = parseFloat(g('m-tax')) || 0;
  const taxGrade = g('m-tax-grade');
  const age = parseInt(g('m-age')) || 0;
  const instCount = parseInt(g('m-inst-count')) || 0;
  const debt = parseFloat(g('m-debt')) || 0;
  const q3 = parseInt(g('m-q3')) || 0;
  const q6 = parseInt(g('m-q6')) || 0;
  const cc = parseInt(g('m-cc')) || 0;
  const hasTech = g('m-tech') === '1';
  const exclude = g('m-exclude').split(/[,，]/).map(s => s.trim()).filter(Boolean);
  const dual = g('m-dual') === '1';
  const tiers = DATA.rules.tiers || {{}};
  const tierBonus = {{ T1: 15, T2: 8, T3: 3, T4: 1 }};
  const riskWarn = [];
  if (cc > 90) riskWarn.push('信用卡使用率 > 90%');
  if (income > 0 && debt > 0 && debt / income > 0.5) riskWarn.push('销贷比 > 50%');
  if (q6 > 12) riskWarn.push('近6月查询 > 12次');
  let resultHtml = '';
  riskWarn.forEach(r => resultHtml += '<div class="risk-warn">⚠️ ' + r + '</div>');
  const matches = [];
  DATA.products.forEach(p => {{
    if (exclude.some(e => p.bank.includes(e))) return;
    if (p.max_age && age > p.max_age) return;
    if (p.min_age && age < p.min_age) return;
    if (p.tech_required && !hasTech) return;
    if (p.inst_max && instCount > p.inst_max) return;
    if (p.query_6m_max && q6 > p.query_6m_max) return;
    if (p.query_3m_max && q3 > p.query_3m_max) return;
    if (p.min_tax && tax < p.min_tax / 10000) return;
    if (p.dual_sign_required && !dual) return;
    if (p.tax_grades && p.tax_grades.length && taxGrade && !p.tax_grades.includes(taxGrade)) return;
    let score = 50;
    score += tierBonus[tiers[p.bank]] || 0;
    if (hasTech && p.tech_required) score += 10;
    if (taxGrade === 'A') score += 5;
    if (q6 <= 6) score += 5;
    score -= Math.min(instCount * 2, 20);
    const reasons = [];
    if (tiers[p.bank]) reasons.push(tiers[p.bank] + '层级');
    if (p.tech_required && hasTech) reasons.push('科技匹配');
    if (p.rate_min) reasons.push('利率' + p.rate_min + '%起');
    matches.push({{
      bank: p.bank, product: p.product, rate: p.rate,
      amount: p.amount_max ? (p.amount_max / 10000).toFixed(0) + '万' : '待确认',
      score, reason: reasons.join(' · ')
    }});
  }});
  matches.sort((a, b) => b.score - a.score);
  const top = matches.slice(0, 15);
  if (top.length) {{
    resultHtml += '<div style="font-weight:600;margin:12px 0 6px">推荐产品（前15）</div>';
    top.forEach((m, i) => {{
      resultHtml += '<div class="match-item"><div class="bank">' + (i+1) + '. ' + m.bank + ' · ' + m.product + '</div><div class="product">' + m.rate + ' | 额度' + m.amount + '</div><div class="reason">' + m.reason + '</div></div>';
    }});
  }} else {{
    resultHtml += '<div class="empty">没有匹配的产品</div>';
  }}
  document.getElementById('matchResult').innerHTML = resultHtml;
}}

// ========== 出方案 ==========
function showScheme(name) {{
  const client = DATA.clients.find(c => c.name === name);
  if (!client) return;
  const recs = DATA.recommendations && DATA.recommendations[name];
  const allInsts = client.all_institutions || [];
  const comp = DATA.completeness && DATA.completeness[name];

  let html = `<h3 style="margin-bottom:12px">📄 ${{name}} · 落实建议</h3>`;

  // 数据完整性
  if (comp && comp.missing.length) {{
    html += '<div class="risk-warn">⚠️ 缺失数据: ' + comp.missing.join('、') + '（影响推荐准确性）</div>';
  }}

  // 客户关键数据
  html += `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;font-size:12px">
    <span>💰 开票${{client.income || 0}}万</span>
    <span>| 负债${{client.debt_total || 0}}万</span>
    <span>| ${{client.legal_age || '?'}}岁</span>
    <span>| ${{client.inst_count || 0}}家机构</span>
    <span>| ${{client.is_dual_sign ? '可双签' : '单签'}}</span>
    ${{client.tax_grade ? '| 纳税'+client.tax_grade+'级' : ''}}
  </div>`;

  // 存量银行
  if (allInsts.length) {{
    html += '<div style="margin-bottom:10px;font-size:12px;color:#666">已有贷款银行: ' + [...new Set(allInsts)].join('、') + '</div>';
  }}

  // 推荐方案
  if (recs && recs.length) {{
    const tiers = {{ T1: '首选', T2: '次选', T3: '补充', T4: '可选' }};
    html += '<div style="font-weight:600;margin-bottom:6px">推荐申请顺序：</div>';
    recs.forEach((bank, i) => {{
      const tier = DATA.rules.tiers && DATA.rules.tiers[bank];
      const rate = DATA.rules.rates && DATA.rules.rates[bank];
      const tierName = tiers[tier] || '可选';
      const num = i + 1;
      html += '<div class="match-item" style="margin-bottom:4px;padding:8px">';
      html += '<div class="bank">' + num + '. ' + bank + ' <span class="tier-badge tier-' + tier + '">' + tierName + '</span>' + (rate ? ' <span style="font-size:11px;color:#4361ee">获贷率' + rate + '</span>' : '') + '</div>';
      // 找该银行的产品
      const prods = DATA.products.filter(p => p.bank === bank).slice(0, 2);
      if (prods.length) {{
        html += '<div class="product">推荐产品: ' + prods.map(p => p.product).join('、') + '</div>';
        html += '<div class="reason">利率' + prods[0].rate + ' | 额度' + (prods[0].amount_max ? (prods[0].amount_max/10000).toFixed(0)+'万' : '待确认') + '</div>';
      }}
      html += '</div>';
    }});
  }} else {{
    html += '<div class="empty">暂无推荐方案</div>';
  }}

  document.getElementById('detailContent').innerHTML = html;
  document.getElementById('detailModal').style.display = 'block';
}}

// ========== 客户详情 ==========
function showDetail(name) {{
  const detail = DATA.details && DATA.details[name];
  const client = DATA.clients.find(c => c.name === name);
  if (!client) return;

  let html = `<h3 style="margin-bottom:12px">${{name}}</h3>`;

  // 关键指标卡片
  html += `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
    <div class="stat" style="flex:1;min-width:70px;padding:8px"><div class="num" style="font-size:16px">${{client.income || 0}}</div><div class="label">开票(万)</div></div>
    <div class="stat" style="flex:1;min-width:70px;padding:8px"><div class="num" style="font-size:16px">${{client.debt_total || 0}}</div><div class="label">负债(万)</div></div>
    <div class="stat" style="flex:1;min-width:70px;padding:8px"><div class="num" style="font-size:16px">${{client.legal_age || '?'}}</div><div class="label">年龄</div></div>
    <div class="stat" style="flex:1;min-width:70px;padding:8px"><div class="num" style="font-size:16px">${{client.inst_count || 0}}</div><div class="label">机构数</div></div>
  </div>`;

  // 操作按钮
  html += `<div style="margin-bottom:12px">
    <span class="btn-sm scheme" onclick="document.getElementById('detailModal').style.display='none';setTimeout(()=>showScheme('${{name}}'),100)">📄 出方案</span>
  </div>`;

  // 完整档案文本
  if (detail) {{
    html += '<div class="detail-text">' + detail + '</div>';
  }}

  document.getElementById('detailContent').innerHTML = html;
  document.getElementById('detailModal').style.display = 'block';
}}
</script>
